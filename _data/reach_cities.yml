# Reach map data
# Faculty locations: CBPAI FDP cohorts 1–16, plus the Aug 2026 participant sheet.
#   District names in that sheet (Gautam Buddha Nagar, Bengaluru Urban, Mumbai
#   Suburban, the four Delhi districts, etc.) are folded into their parent city
#   rather than plotted separately — one dot per place, not per administrative unit.
# Student locations: Samagama registered students, all 115 matched cities
#   (Student_Origins, Aug 2026 — 8,517 application records, 6,135 with a city)
#   — these are college addresses parsed from applications, not verified hometowns
# To add a city: add name, state, lat, lng, and type (faculty / student / both)
# Use "both" when a city has been reached by faculty AND student programmes
# Coordinates are city centre approximations

